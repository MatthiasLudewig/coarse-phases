name: Build and deploy wiki

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Wiki checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WIKI_EDIT_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            requirements-test.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Build with strict reference checking
        run: python -m sphinx -b html -n -W --keep-going docs docs/_build/html
      - name: Verify invalid content fails the build
        run: python tests/check_build_failures.py
      - name: Install Chromium on the runner
        run: python -m playwright install --with-deps chromium
      - name: Check the rendered wiki in a browser
        run: python tests/check_browser.py
      - name: Upload HTML for review
        uses: actions/upload-artifact@v7
        with:
          name: wiki-html
          path: docs/_build/html/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wiki-screenshots
          path: artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare Pages artifact when publication is enabled
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' &&
          !github.event.repository.private && vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    name: Publish approved main branch
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      !github.event.repository.private && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
